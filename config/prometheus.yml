# Prometheus Configuration for Tanghe Digital Twin
# 唐河倒虹吸监控配置

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'tanghe-siphon'
    static_configs:
      - targets: ['tanghe-siphon:5000']
    metrics_path: '/api/metrics'
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
